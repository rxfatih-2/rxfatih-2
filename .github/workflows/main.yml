name: generate arcade contribution graphs
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # 1. Bikin grafik Pacman
      - name: generate pacman graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      # 2. Ganti nama file Pacman biar ga ketimpa
      - name: Rename pacman SVG
        run: |
          mv dist/pacman-contribution-graph.svg dist/pacman-only.svg
          mv dist/pacman-contribution-graph-dark.svg dist/pacman-only-dark.svg

      # 3. Bikin grafik Bomberman
      - name: generate bomberman graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'bomberman'

      # 4. Ganti nama file Bomberman
      - name: Rename bomberman SVG
        run: |
          mv dist/pacman-contribution-graph.svg dist/bomberman-only.svg
          mv dist/pacman-contribution-graph-dark.svg dist/bomberman-only-dark.svg

      # 5. Push semua file ke branch output
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
