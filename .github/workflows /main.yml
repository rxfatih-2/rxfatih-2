name: generate arcade contribution graphs
on:
  schedule: # Jalan otomatis tiap 24 jam
    - cron: '0 0 * * *'
  workflow_dispatch: # Bisa dipicu manual
  push: # Jalan tiap ada push
    branches: - main

jobs:
  generate:
    permissions: { contents: write }
    runs-on: ubuntu-latest
    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          rxfatih-2: ${{ github.repository_owner }}
          games: 'pacman' # Bisa diganti game lain (lihat daftar di bawah)

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
